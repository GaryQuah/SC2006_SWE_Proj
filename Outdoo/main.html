<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width", initial-scale="1.0"/>
        <link rel="stylesheet" href="css/mainstyle.css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <title>Outdoo</title>
    </head>
    <body>
        <div class="main-grid">
            <header>
                <div class="header">
                    <div class = "menu-logo">
                        <a href="" class="Menu"><i class="fa fa-bars fa-1x" style="color:black"></i></a>

                        <h4 class="logo">
                            <a href="main.html">
                                <img src="images/Hiking icon.png">Outdoo
                            </a>
                        </h4>
                    </div>
                    <a href="" class="profile"><i class="fa fa-user-circle fa-1x" style="color: black;"></i></a>
                </div>
            </header>
            <main>
                <!--to add points data here-->
                <section class="user-points">
                    <h2 class="section-title">Your Points</h2>
                    <h2 class="Information" id="user-point">User's Points</h2>
                </section>
                <!--to add real time data here-->
                <section class="real-time-information">
                    <div class="real-time-information__UV">
                        <h2 class="section-title">UV Index</h2>
                        <h2 class="Information" id="uv-index">...</h2>
                        <p>Moderate risk of harm from unprotected sun</p>
                    </div>
                    <div class="real-time-information__Weather">
                        <h2 class="section-title">Weather</h2>
                        <h2 class="Information" id="weather-temperature">...</h2>
                        <p>Partly cloudy with a sight chance of rain</p>
                    </div>
                </section>
    
                <section class="upcoming-activities">
                    <div class=upcoming-activities__header>
                        <h2 class="section-title">Upcoming Activities</h2>
                        <img src="images/Calender icon.png" class="Calender-icon">
                    </div>
                    
                    <!--to add activities data here-->
                    <div class="activity-log"></div>
                </section>
                
                <div class="btn-group1">
                    <!--Add activity button-->
                    <a href="addactivity.html" class="btn-primary"><h2>Add Activity +</h2></a>
                    <!--view map button button-->
                    <a href="" class="btn-primary"><h2>View Map</h2></a>
                </div>
                
                <!--health buddy and claim rewards button button-->
                <div class="btn-group2">
                    <a href="" class="btn-healthbuddy">
                        <img src="images/Chatbot white Icon.png">
                        <p>Health Buddy</p>
                    </a>

                    <a href="" class="btn-reward">
                        <img src="images/Hand Reward icon.png">
                        <p>Claim Rewards</p>
                    </a>
                </div>
            </main>
        </div>
        
        <footer>
            <ul class="nav">
                <li><a href="#"><img src="images/Home icon.png"></a></li>
                <li><a href="#"><img src="images/Trophy icon.png"></a></li>
                <li><a href="#"><img src="images/Settings icon.png"></a></li>
            </ul>
        </footer>
    </body>
    <script src="/js/main.js"></script>
</html>
